name: Apply agent-authored Python SVG workflow

on:
  push:
    branches:
      - feat/agent-authored-python-svg

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agent-authored-python-svg
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply dynamic SVG authoring changes
        run: python3 .github/scripts/apply_agent_svg_authoring.py
      - name: Validate and synchronize
        run: |
          npm ci
          npm run sync:skills
          npm run check
      - name: Commit applied changes
        run: |
          rm -f .github/workflows/apply-agent-svg-authoring.yml
          rm -f .github/scripts/apply_agent_svg_authoring.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: make Python SVG authoring agent-driven"
          git push origin HEAD:feat/agent-authored-python-svg
