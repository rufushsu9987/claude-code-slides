        d.add(d.multiline(takeaway, 54, 650, width=1080, size=23, weight=700,
                          family="Georgia, Iowan Old Style, serif", max_lines=2))

    return title, "A configurable four-stage mechanism loop around a central outcome, with optional proof details and a single takeaway."
