name: Apply configurable mechanism loop

on:
  push:
    branches:
      - feat/configurable-mechanism-loop

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/configurable-mechanism-loop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply repository changes
        run: python3 .github/scripts/apply_mechanism_loop.py
      - name: Validate repository
        run: |
          npm ci
          npm run sync:skills
          npm run check
      - name: Commit applied changes
        run: |
          rm -f .github/workflows/apply-mechanism-loop.yml
          rm -f .github/scripts/apply_mechanism_loop.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add configurable mechanism-loop SVG"
          git push origin HEAD:feat/configurable-mechanism-loop
