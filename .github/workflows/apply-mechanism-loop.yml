name: Apply configurable mechanism loop

on:
  push:
    branches:
      - feat/configurable-mechanism-loop

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/configurable-mechanism-loop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply mechanism-loop generator and workflow guidance
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, content):
              Path(path).write_text(content, encoding='utf-8', newline='\n')

          def replace_once(content, old, new, path):
              if content.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one occurrence of replacement anchor, found {content.count(old)}')
              return content.replace(old, new, 1)

          # ------------------------------------------------------------------
          # Python SVG generator: add a configurable mechanism-loop kind.
          # ------------------------------------------------------------------
