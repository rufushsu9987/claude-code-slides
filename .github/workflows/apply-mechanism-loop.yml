name: Apply configurable mechanism loop

on:
  push:
    branches:
      - feat/configurable-mechanism-loop

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/configurable-mechanism-loop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply repository changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/scripts/apply_mechanism_loop.py')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'Are decorative orbit, concentric-circle, logo-cloud, or unreadable micro-label diagrams absent from the cover?':
                  'Are generic orbit, hub-and-spoke, concentric-circle, logo-cloud, and micro-label cover diagrams removed unless they directly prove the thesis?',
              'Treat a decorative or meaningless cover-right diagram as a Major finding. Prefer whitespace when the right-side module lacks a source, clear communication job, or two-second readability.':
                  'Flag a cover as Major when its right half is occupied by an unsourced generic orbit, hub-and-spoke, concentric-circle, logo-cloud, or micro-label diagram that does not directly prove the title. Recommend whitespace or one sourced artifact, compact proof rail, operational signal, or direct system cue instead.',
              'Treat a decorative or meaningless cover-right diagram as Major. Prefer whitespace when the module lacks a source, clear communication job, or two-second readability.':
                  'Flag a cover as Major when its right half is occupied by an unsourced generic orbit, hub-and-spoke, concentric-circle, logo-cloud, or micro-label diagram that does not directly prove the title. Recommend whitespace or one sourced artifact, compact proof rail, operational signal, or direct system cue instead.',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          agent_block = '''path = "agents/visual-director.md"
          text = read(path)
          if "`mechanismHandoff`" not in text:
              cover_anchor = "4. For each cover or section opener, a `coverRight` decision: `none`, `artifact-right`, `proof-rail`, `signal-stack`, or `direct-system-cue`, with the source and why it earns its place.\\n"
              if cover_anchor not in text:
                  raise SystemExit(f"{path}: coverRight anchor missing")
              text = text.replace(
                  cover_anchor,
                  cover_anchor + "5. For mechanism-led openings, a `mechanismHandoff`: next-page archetype, four named stages when applicable, central outcome, and whether to generate a Python `mechanism-loop` SVG.\\n",
                  1,
              )
              text = text.replace("5. A layout-diversity audit:", "6. A layout-diversity audit:", 1)
              text = text.replace("6. Diagram or data-visualization specifications", "7. Diagram or data-visualization specifications", 1)
              text = text.replace("7. Required assets", "8. Required assets", 1)
              text = text.replace("8. Accessibility", "9. Accessibility", 1)
          rule_anchor = "- Keep any cover-side module secondary to the title and no wider than roughly one-third of the canvas.\\n"
          if "Treat proof rails as evidence" not in text:
              if rule_anchor not in text:
                  raise SystemExit(f"{path}: cover rule anchor missing")
              text = text.replace(
                  rule_anchor,
                  rule_anchor + "- Treat proof rails as evidence: name each signal's role and relationship, and keep mixed disclosure dates visible.\\n- Move causal or cyclical explanations to the next page and prefer a content-specific `mechanism-loop`, `operating-loop`, or `infographic-story` over an overloaded cover.\\n",
                  1,
              )
          write(path, text)

          path = "agents/deck-reviewer.md"
          text = read(path)
          reviewer_anchor = "Flag a cover as Major when its right half is occupied by an unsourced generic orbit, hub-and-spoke, concentric-circle, logo-cloud, or micro-label diagram that does not directly prove the title. Recommend whitespace or one sourced artifact, compact proof rail, operational signal, or direct system cue instead.\\n"
          if "proof rails that mix unrelated signals" not in text:
              if reviewer_anchor not in text:
                  raise SystemExit(f"{path}: reviewer cover anchor missing")
              text = text.replace(
                  reviewer_anchor,
                  reviewer_anchor.rstrip("\\n") + " Flag proof rails that mix unrelated signals without semantic roles, relationship, and visible dates. When the opening thesis is mechanism-led, require a dedicated next-page causal model instead of a denser cover.\\n",
                  1,
              )
          write(path, text)'''

          pattern = re.compile(
              r'path = "agents/visual-director\.md"\n.*?write\(path, text\)\n\npath = "agents/deck-reviewer\.md"\n.*?write\(path, text\)',
              re.S,
          )
          text, count = pattern.subn(agent_block, text, count=1)
          if count != 1:
              raise SystemExit('unable to replace agent migration block')

          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          python3 .github/scripts/apply_mechanism_loop.py
      - name: Validate repository
        run: |
          npm ci
          npm run sync:skills
          npm run check
      - name: Commit applied changes
        run: |
          rm -f .github/workflows/apply-mechanism-loop.yml
          rm -f .github/scripts/apply_mechanism_loop.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add configurable mechanism-loop SVG"
          git push origin HEAD:feat/configurable-mechanism-loop
