<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Make progress visible</title>
  <desc id="desc">A dominant metric connected to a simple progress trend.</desc>
  <rect width="1200" height="700" fill="#F7F3EC"/>
<text x="60" y="54" fill="#D97757" font-size="16" font-family="Arial, sans-serif" font-weight="700" text-anchor="start">DATA JOURNEY</text><text x="60" y="102" fill="#211F1B" font-size="42" font-family="Georgia, serif" font-weight="700" text-anchor="start">Make progress visible</text><text x="60" y="136" fill="#6F6962" font-size="20" font-family="Arial, sans-serif" font-weight="400" text-anchor="start">A reusable vector asset for a content-aware slide layout.</text><rect x="60" y="190" width="300" height="350" rx="18" fill="#F1D9CD" stroke="#D97757" stroke-width="2"/><text x="90" y="235" fill="#D97757" font-size="16" font-family="Arial, sans-serif" font-weight="700" text-anchor="start">CURRENT SIGNAL</text><text x="90" y="350" fill="#D97757" font-size="104" font-family="Georgia, serif" font-weight="700" text-anchor="start">82%</text><text x="94" y="395" fill="#211F1B" font-size="24" font-family="Arial, sans-serif" font-weight="700" text-anchor="start">of the target reached</text><text x="94" y="458" fill="#6F6962" font-size="18" font-family="Arial, sans-serif" font-weight="400" text-anchor="start">Show one number first, then let the chart explain its movement.</text><rect x="420" y="190" width="720" height="350" rx="18" fill="#FFFDF9" stroke="#D8D0C6" stroke-width="2"/><text x="455" y="235" fill="#D97757" font-size="16" font-family="Arial, sans-serif" font-weight="700" text-anchor="start">PROGRESS OVER TIME</text><line x1="470" y1="460" x2="1080" y2="460" stroke="#D8D0C6" stroke-width="2"/><line x1="470" y1="290" x2="470" y2="460" stroke="#D8D0C6" stroke-width="2"/><line x1="470.0" y1="460" x2="470.0" y2="400.5" stroke="#F1D9CD" stroke-width="10"/><circle cx="470.0" cy="400.5" r="9" fill="#6F6962" stroke="none" stroke-width="0"/><text x="470.0" y="494" fill="#6F6962" font-size="14" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">Q1</text><line x1="622.5" y1="460" x2="622.5" y2="381.8" stroke="#F1D9CD" stroke-width="10"/><circle cx="622.5" cy="381.8" r="9" fill="#6F6962" stroke="none" stroke-width="0"/><text x="622.5" y="494" fill="#6F6962" font-size="14" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">Q2</text><line x1="775.0" y1="460" x2="775.0" y2="371.6" stroke="#F1D9CD" stroke-width="10"/><circle cx="775.0" cy="371.6" r="9" fill="#6F6962" stroke="none" stroke-width="0"/><text x="775.0" y="494" fill="#6F6962" font-size="14" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">Q3</text><line x1="927.5" y1="460" x2="927.5" y2="344.4" stroke="#F1D9CD" stroke-width="10"/><circle cx="927.5" cy="344.4" r="9" fill="#6F6962" stroke="none" stroke-width="0"/><text x="927.5" y="494" fill="#6F6962" font-size="14" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">Q4</text><line x1="1080.0" y1="460" x2="1080.0" y2="320.6" stroke="#F1D9CD" stroke-width="10"/><circle cx="1080.0" cy="320.6" r="9" fill="#D97757" stroke="none" stroke-width="0"/><text x="1080.0" y="494" fill="#6F6962" font-size="14" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">Q5</text><polyline fill="none" stroke="#D97757" stroke-width="5" points="470.0,400.5 622.5,381.8 775.0,371.6 927.5,344.4 1080.0,320.6"/><text x="1018" y="284" fill="#6F6962" font-size="15" font-family="Arial, sans-serif" font-weight="700" text-anchor="start">trend</text><text x="455" y="505" fill="#211F1B" font-size="18" font-family="Arial, sans-serif" font-weight="700" text-anchor="start">Evidence → interpretation → next action</text>
</svg>
