<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Choose the next action</title>
  <desc id="desc">A decision path from signal to evaluation and recommendation.</desc>
  <rect width="1200" height="700" fill="#F7F3EC"/>
<text x="60" y="54" fill="#D97757" font-size="16" font-family="Arial, sans-serif" font-weight="700" text-anchor="start">DECISION PATH</text><text x="60" y="102" fill="#211F1B" font-size="42" font-family="Georgia, serif" font-weight="700" text-anchor="start">Choose the next action</text><text x="60" y="136" fill="#6F6962" font-size="20" font-family="Arial, sans-serif" font-weight="400" text-anchor="start">A reusable vector asset for a content-aware slide layout.</text><text x="60" y="205" fill="#D97757" font-size="16" font-family="Arial, sans-serif" font-weight="700" text-anchor="start">START WITH THE SIGNAL</text><rect x="60" y="250" width="220" height="112" rx="16" fill="#FFFDF9" stroke="#D8D0C6" stroke-width="2"/><text x="88" y="300" fill="#211F1B" font-size="28" font-family="Arial, sans-serif" font-weight="700" text-anchor="start">Signal</text><text x="88" y="334" fill="#6F6962" font-size="18" font-family="Arial, sans-serif" font-weight="400" text-anchor="start">What changed?</text><line x1="282" y1="306" x2="366.24" y2="306.0" stroke="#D97757" stroke-width="5"/><path d="M 352.24 288.0 L 390 306 L 348.24 314.0 Z" fill="#D97757"/><rect x="390" y="250" width="250" height="112" rx="16" fill="#F1D9CD" stroke="#D97757" stroke-width="2"/><text x="420" y="300" fill="#211F1B" font-size="28" font-family="Arial, sans-serif" font-weight="700" text-anchor="start">Evaluate</text><text x="420" y="334" fill="#6F6962" font-size="18" font-family="Arial, sans-serif" font-weight="400" text-anchor="start">Which constraint matters?</text><line x1="642" y1="306" x2="722.34" y2="251.4" stroke="#D97757" stroke-width="5"/><path d="M 708.34 233.4 L 745 236 L 704.34 259.4 Z" fill="#D97757"/><line x1="642" y1="306" x2="722.34" y2="402.72" stroke="#D97757" stroke-width="5"/><path d="M 708.34 384.72 L 745 430 L 704.34 410.72 Z" fill="#D97757"/><rect x="760" y="180" width="330" height="112" rx="16" fill="#FFFDF9" stroke="#D8D0C6" stroke-width="2"/><text x="790" y="230" fill="#211F1B" font-size="28" font-family="Arial, sans-serif" font-weight="700" text-anchor="start">Proceed</text><text x="790" y="264" fill="#6F6962" font-size="18" font-family="Arial, sans-serif" font-weight="400" text-anchor="start">Evidence supports the change</text><rect x="760" y="375" width="330" height="112" rx="16" fill="#27241F" stroke="#27241F" stroke-width="0"/><text x="790" y="425" fill="#FFFDF9" font-size="28" font-family="Arial, sans-serif" font-weight="700" text-anchor="start">Pause</text><text x="790" y="459" fill="#F1D9CD" font-size="18" font-family="Arial, sans-serif" font-weight="400" text-anchor="start">Missing evidence → collect first</text><line x1="60" y1="570" x2="1090" y2="570" stroke="#D8D0C6" stroke-width="2"/><text x="60" y="610" fill="#D97757" font-size="16" font-family="Arial, sans-serif" font-weight="700" text-anchor="start">RECOMMENDATION</text><text x="60" y="648" fill="#211F1B" font-size="24" font-family="Arial, sans-serif" font-weight="700" text-anchor="start">Make the next action visible, not just the available options.</text>
</svg>
